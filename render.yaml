services:
  # 1. Django Backend Web Service
  - type: web
    name: pkps-saas-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # 2. React Vite Frontend Static Site
  - type: web
    name: pkps-saas-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pkps-saas-backend
          property: host
          prefix: https://
          suffix: /api/v1
